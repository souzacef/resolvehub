spring:
  datasource:
    url: jdbc:h2:mem:resolvehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

resolvehub:
  security:
    jwt:
      secret: test-secret-key-for-jwt-signing-with-minimum-length
      expiration-seconds: 3600
  ai:
    provider: fake
