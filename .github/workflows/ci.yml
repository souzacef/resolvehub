name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required project files
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f docs/architecture.md
          test -f docs/ai-provider-design.md
          test -f docs/testing-strategy.md
          test -f docs/deployment.md
          test -f .github/pull_request_template.md

      - name: Show repository structure
        run: |
          find . -maxdepth 3 -type f | sort

  detect-projects:
    name: Detect project folders
    runs-on: ubuntu-latest
    outputs:
      backend_exists: ${{ steps.detect.outputs.backend_exists }}
      frontend_exists: ${{ steps.detect.outputs.frontend_exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend and frontend projects
        id: detect
        run: |
          if [ -f backend/pom.xml ]; then
            echo "backend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f frontend/package.json ]; then
            echo "frontend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_exists=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - detect-projects
    if: ${{ needs.detect-projects.outputs.backend_exists == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw clean verify

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - detect-projects
    if: ${{ needs.detect-projects.outputs.frontend_exists == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run